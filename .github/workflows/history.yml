name: history
on:
  workflow_dispatch:
    inputs:
      years:
        description: "몇 년 치"
        required: false
        default: "3"
  schedule:
    - cron: "0 12 * * 0"
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/history.mjs ${{ github.event.inputs.years || '3' }}
        env:
          KAMIS_CERT_KEY: ${{ secrets.KAMIS_CERT_KEY }}
          KAMIS_CERT_ID: ${{ secrets.KAMIS_CERT_ID }}
      - run: |
          git config user.name "kamis-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: price history $(date -u +%F)"
          git pull --rebase
          git push
